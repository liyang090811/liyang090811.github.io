<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#ffb6cf">

<title>给最可爱的你 🎂</title>

<style>

*{box-sizing:border-box}

:root{--pink:#ff8fb8;--deep:#ff4f91;--cream:#fff8fb}

body{margin:0;min-height:100vh;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(145deg,#ffe4ef,#fff4f8 50%,#f8e5ff);color:#70465a;overflow-x:hidden}

button,input{font:inherit}

.page{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px}

.card{width:100%;max-width:430px;padding:30px 22px;border:1px solid #ffffffc9;border-radius:28px;background:#ffffffd9;box-shadow:0 18px 55px #e88bb329;text-align:center;backdrop-filter:blur(12px)}

.heart{font-size:48px;animation:heartbeat 1.5s infinite}

h1{font-size:25px;line-height:1.5;margin:12px 0;color:#e9518b}

.subtitle{font-size:14px;color:#b17b94;line-height:1.8;margin-bottom:24px}

input{display:block;width:100%;min-width:0;border:2px solid #ffd2e2;border-radius:16px;padding:15px 14px;outline:none;background:#fffafd;color:#74455b;text-align:center;transition:.2s}

input:focus{border-color:#ff8fb8;box-shadow:0 0 0 4px #ff8fb822}

.submit{display:block;width:100%;margin-top:14px;border:0;border-radius:16px;padding:15px;background:linear-gradient(100deg,#ff91b9,#ff6eaa);color:white;font-weight:700;box-shadow:0 7px 18px #ff8bb54d;cursor:pointer}

.submit:active{transform:scale(.98)}

#error{min-height:24px;margin-top:12px;color:#e9518b;font-size:13px}

.hidden{display:none!important}

#birthday{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;background:linear-gradient(155deg,#fff0f6,#ffe1ed 48%,#f4dcff)}

.birthday-card{position:relative;z-index:2;width:100%;max-width:460px;margin:auto;padding:28px 22px;text-align:center}

.cake{font-size:76px;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 12px #f99bb544)}

.birthday-title{font-size:clamp(27px,7vw,38px);color:#e84d91;margin:14px 0;line-height:1.4;text-shadow:0 3px 0 #fff}

.birthday-subtitle{font-size:14px;color:#b87595;margin-bottom:20px}

.message{padding:24px 20px;border:1px solid #fff;border-radius:24px;background:#ffffffd9;box-shadow:0 12px 35px #d984ac26;text-align:left;font-size:16px;line-height:2;color:#88516d;white-space:pre-line}

.signature{text-align:right;color:#e9518b;margin-top:18px;font-size:14px}

.decor{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}

.float{position:absolute;bottom:-50px;opacity:0;animation:floatUp linear infinite}

.confetti{position:fixed;top:-15px;width:9px;height:15px;opacity:.85;z-index:3;pointer-events:none;animation:fall linear forwards}

#adult{background:radial-gradient(ellipse at top,#482039,#180b19 70%);color:#fff0f6}

.adult-card{width:100%;max-width:440px;padding:25px 18px}

.adult-header{padding:15px 12px;background:#230e20;border:1px solid #8b315f;border-radius:8px}

.adult-label{font-size:12px;letter-spacing:4px;color:#ff8ab9}

.adult-title{font-size:27px;color:#ff9ac5;margin:12px 0}

.adult-panel{margin-top:16px;padding:23px 18px;border:1px solid #64304f;border-radius:12px;background:linear-gradient(160deg,#35152f,#1f1022);box-shadow:0 12px 35px #0005;line-height:2;font-size:16px;text-align:left;color:#ffe3ef;white-space:pre-line}

.adult-footer{font-size:12px;color:#b47b9f;text-align:center;margin-top:18px}

.back{border:1px solid #a7507d;border-radius:12px;background:#35152f;color:#ffd7e9;padding:12px;width:100%;margin-top:18px}

@keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}

@keyframes floatUp{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:.85}90%{opacity:.8}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}

@keyframes fall{to{transform:translate3d(var(--drift),110vh,0) rotate(720deg);opacity:.9}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

</style>

</head>

<body>

<section class="page" id="home">

  <main class="card">

    <div class="heart">💗</div>

    <h1>你觉得你是什么？</h1>

    <p class="subtitle">请认真回答哦。答对了才有生日惊喜 🎁</p>

    <form id="answerForm">

      <input id="answer" type="text" placeholder="输入你的答案……" autocomplete="off" enterkeyhint="go" required>

      <button class="submit" type="submit">揭晓我的惊喜 ✨</button>

      <div id="error" role="status" aria-live="polite"></div>

    </form>

  </main>

</section>

<section class="page hidden" id="birthday">

  <div class="decor" id="decor"></div>

  <main class="birthday-card">

    <div class="cake">🎂</div>

    <h1 class="birthday-title">生日快乐，我的小布丁！</h1>

    <p class="birthday-subtitle">✦ 今天全世界都要偏爱你 ✦</p>

    <article class="message" id="sweetMessage"></article>

    <div class="signature">永远偏爱你的人 💌</div>

    <button class="submit" id="replay">再收一次生日祝福 🎉</button>

  </main>

</section>

<section class="page hidden" id="adult">

  <main class="adult-card">

    <header class="adult-header">

      <div class="adult-label">♡ PRIVATE BIRTHDAY CLUB ♡</div>

      <h1 class="adult-title">WELCOME, LITTLE CAT</h1>

      <div style="font-size:12px;color:#d6a0bc">A SPECIAL MESSAGE JUST FOR YOU</div>

    </header>

    <article class="adult-panel" id="teaseMessage"></article>

    <div class="adult-footer">18TH BIRTHDAY · MADE WITH LOVE ♡</div>

    <button class="back" id="backHome">返回首页</button>

  </main>

</section>

<script>

const home = document.getElementById('home');

const birthday = document.getElementById('birthday');

const adult = document.getElementById('adult');

const answer = document.getElementById('answer');

const error = document.getElementById('error');

const sweetText = `可爱的小布丁～我亲亲你！终于18岁啦～我可以陪你过18岁生日，我真的太幸福惹！🥺💗

今天你就是全世界最最最可爱的小寿星！要吃好多好多蛋糕，要收到好多好多祝福，还要一直一直开心！

我真想好好亲亲你，把所有的喜欢都偷偷塞进每一个亲亲里，再把你抱进怀里，认真地跟你说一句：生日快乐呀，我最珍贵的小宝贝。

以后也要继续做那个可可爱爱、偶尔调皮、会撒娇又让人心动的小布丁。开心的时候要和我分享，委屈的时候也可以来找我。

新的一岁，希望你每天都有好心情，想做的事情都能慢慢实现，遇到烦恼也总有人陪你。至于我嘛，我的愿望很简单——希望以后每一个值得纪念的生日，都能有机会陪在你身边。

蛋糕要吃，礼物要拆，愿望要许！还有还有，今天的寿星必须多收一点亲亲，不接受反驳！😘

最后再说一次：18岁生日快乐，我可爱的小布丁。谢谢你来到我的世界，让平平常常的日子也变得闪闪发光。今天、明天，还有未来的好多好多天，都要幸福呀！🎂🎀💗`;

const teaseText = `我可爱的骚骚老婆～祝你18岁生日快乐了哦～🎂💗

恭喜你这个小骚货终于18岁啦！今天可是你的专属生日，必须开开心心地过，蛋糕要吃，礼物要收，生日愿望也要认真许好！

我可会把你盯得更紧的！谁让你是我可爱的小猫咪呀。哦～骚骚的小猫咪！一想到你就忍不住想逗逗你，嘻嘻。😼💕

不过今天寿星最大，所以准许你多撒娇一会儿，多收一点亲亲，多享受一点偏爱。

以后也要继续做那个可爱又调皮的小猫咪，记得按时吃饭，好好睡觉，难过了就告诉我，开心了也要第一时间来跟我分享。

新的一岁，希望你每天都能笑得甜甜的，想要的惊喜一个接一个，烦恼通通跑远远。至于我嘛，当然会继续认真喜欢你、宠着你，把你的每一个小情绪都放在心上。

生日快乐呀，我最可爱的骚骚老婆～今天你最大！快把愿望许好，然后准备好收下满满的爱吧！🎁💋`;

document.getElementById('answerForm').addEventListener('submit', function(e) {

  e.preventDefault();

  const value = answer.value.trim().replace(/[！!。.,，\s]/g, '').toLowerCase();

  if (value === '1小骚货' || value === '小骚货') {

    home.classList.add('hidden');

    birthday.classList.add('hidden');

    adult.classList.remove('hidden');

    document.getElementById('teaseMessage').textContent = teaseText;

    window.scrollTo(0, 0);

  } else if (value === '小猫咪') {

    home.classList.add('hidden');

    adult.classList.add('hidden');

    birthday.classList.remove('hidden');

    document.getElementById('sweetMessage').textContent = sweetText;

    startBirthday();

    window.scrollTo(0, 0);

  } else {

    error.textContent = '哎呀，答案不对哦，再想想嘛～ 🥺';

    answer.focus();

  }

});

function startBirthday() {

  const decor = document.getElementById('decor');

  decor.innerHTML = '';

  const symbols = ['💗','💕','✨','🎀','🌸','💖','⭐','🎉'];

  for (let i = 0; i < 24; i++) {

    const el = document.createElement('span');

    el.className = 'float';

    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];

    el.style.left = Math.random() * 100 + '%';

    el.style.animationDelay = (Math.random() * 8) + 's';

    el.style.animationDuration = (7 + Math.random() * 8) + 's';

    el.style.fontSize = (16 + Math.random() * 20) + 'px';

    decor.appendChild(el);

  }

  confettiBurst();

}

function confettiBurst() {

  const colors = ['#ff79aa','#ffd166','#c9a0ff','#ffb3cf','#fff'];

  for (let i = 0; i < 65; i++) {

    const el = document.createElement('span');

    el.className = 'confetti';

    el.style.left = Math.random() * 100 + 'vw';

    el.style.background = colors[Math.floor(Math.random() * colors.length)];

    el.style.borderRadius = Math.random() > .5 ? '50%' : '2px';

    el.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');

    el.style.animationDuration = (2.5 + Math.random() * 3) + 's';

    el.style.animationDelay = Math.random() * 1.2 + 's';

    document.body.appendChild(el);

    el.addEventListener('animationend', () => el.remove());

  }

}

document.getElementById('replay').addEventListener('click', confettiBurst);

document.getElementById('backHome').addEventListener('click', () => {

  adult.classList.add('hidden');

  birthday.classList.add('hidden');

  home.classList.remove('hidden');

  answer.value = '';

  error.textContent = '';

  window.scrollTo(0, 0);

});

</script>

</body>

</html>
